name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log || {
            python3 .github/scripts/print_test_errors.py
            exit 1
          }

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-test-failure-logs
          path: |
            gradle-test.log
            app/build/reports/

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
