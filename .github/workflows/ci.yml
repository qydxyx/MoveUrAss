name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace || {
            echo "::error::Unit tests failed"
            python3 -c "
import glob, xml.etree.ElementTree as ET
for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
    tree = ET.parse(f)
    for tc in tree.findall('.//testcase'):
        fail = tc.find('failure')
        if fail is not None:
            c = tc.attrib.get('classname')
            n = tc.attrib.get('name')
            msg = fail.attrib.get('message') or ''
            txt = (fail.text or '').strip()
            first_lines = '\n'.join(txt.splitlines()[:10])
            print(f'::error title=TEST FAILED: {c}.{n}::{msg}\n{first_lines}')
"
            exit 1
          }

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
