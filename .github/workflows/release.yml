name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace || {
            echo "::error::Unit tests failed"
            python3 -c "
import glob, xml.etree.ElementTree as ET
for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
    tree = ET.parse(f)
    for tc in tree.findall('.//testcase'):
        fail = tc.find('failure')
        if fail is not None:
            c = tc.attrib.get('classname')
            n = tc.attrib.get('name')
            msg = fail.attrib.get('message') or ''
            txt = (fail.text or '').strip()
            first_lines = '\n'.join(txt.splitlines()[:10])
            print(f'::error title=TEST FAILED: {c}.{n}::{msg}\n{first_lines}')
"
            exit 1
          }

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name APK from tag
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK produced in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_FILE" "dist/MoveUrAss-${GITHUB_REF_NAME}.apk"
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            腺动 ${{ github.ref_name }} 安装包。

            下载 APK 后，在系统设置里允许安装未知来源应用即可。

