name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee gradle-test.log || {
            python3 .github/scripts/print_test_errors.py
            exit 1
          }

      - name: Upload test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-logs
          path: |
            gradle-test.log
            app/build/reports/

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          else
            echo "Generating fallback CI signing keystore..."
            keytool -genkey -v -keystore /tmp/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass release123 -keypass release123 -dname "CN=MoveUrAss,O=Release,C=CN"
            echo "CI_KEYSTORE_PASSWORD=release123" >> "$GITHUB_ENV"
            echo "CI_KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "CI_KEY_PASSWORD=release123" >> "$GITHUB_ENV"
          fi
          echo "CI_KEYSTORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || env.CI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || env.CI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || env.CI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name APK from tag
        run: |
          mkdir -p dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK produced in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_FILE" "dist/MoveUrAss-${GITHUB_REF_NAME}.apk"
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            腺动 ${{ github.ref_name }} 安装包。

            下载 APK 后，在系统设置里允许安装未知来源应用即可。

